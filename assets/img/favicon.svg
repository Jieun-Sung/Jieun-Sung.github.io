<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A cell whose internal state has been pushed off centre. The asymmetry
       is the point: the mark reads as perturbed rather than at rest. Two
       shapes only, so it survives 16px in a browser tab. -->
  <rect width="32" height="32" rx="6" fill="#00643E"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#F6F7F4" stroke-width="2.6"/>
  <circle cx="20" cy="12" r="3.6" fill="#F6F7F4"/>
</svg>
